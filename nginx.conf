server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Compose and any future reverse proxy can poll this instead of the app itself.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints everything under assets/, so it is safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is not fingerprinted, so a deploy must be visible on the next
    # normal reload rather than waiting out a cache lifetime.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No client-side routing to fall back to: an unmatched path is a real 404,
    # not a hint to serve index.html (base: './' resolves assets relative to
    # the requested path, so a fallback here would 200 with a page whose
    # script/style tags 404 and never render).
    location / {
        try_files $uri $uri/ =404;
    }
}
