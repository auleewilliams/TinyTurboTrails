name: Foundation checks
on:
  # Scoped to main so a commit on a branch with an open pull request is checked
  # once. An unscoped push trigger runs these checks a second time on every such
  # commit. Pull request runs test the merge result, which is the useful one.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      # Builds and smoke-tests the deploy image on every push and pull
      # request, not just on main, so a broken Dockerfile/nginx.conf fails
      # the PR instead of surfacing only in `publish` after merging to main.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tiny-turbo-trails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: npm run test:deployment

  # Depends on `check` passing, so a red build never publishes an image, and
  # only runs on main so a PR from a fork never needs registry credentials.
  publish:
    # All writers share this lock; pending jobs are not ordered by commit age.
    concurrency:
      group: ghcr-main-publish
      cancel-in-progress: false
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse an existing immutable commit image
        id: existing
        run: node scripts/publish-image.mjs existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        if: steps.existing.outputs.digest == ''
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/auleewilliams/tiny-turbo-trails:${{ github.sha }}
          cache-from: type=gha
      - name: Promote only the current checked main revision
        run: node scripts/publish-image.mjs promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ steps.existing.outputs.digest || steps.image.outputs.digest }}
