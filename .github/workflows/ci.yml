name: Foundation checks
on:
  # Scoped to main so a commit on a branch with an open pull request is checked
  # once. An unscoped push trigger runs these checks a second time on every such
  # commit. Pull request runs test the merge result, which is the useful one.
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      # Builds and smoke-tests the deploy image on every push and pull
      # request, not just on main, so a broken Dockerfile/nginx.conf fails
      # the PR instead of surfacing only in `publish` after merging to main.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tiny-turbo-trails:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: |
          docker run -d --name ttt -p 8080:80 tiny-turbo-trails:ci
          for i in $(seq 1 10); do
            curl -sf http://localhost:8080/healthz && break
            sleep 1
          done
          curl -sf http://localhost:8080/healthz
          curl -sf http://localhost:8080/ | grep -q "Tiny Turbo Trails"
          docker stop ttt

  # Depends on `check` passing, so a red build never publishes an image, and
  # only runs on main so a PR from a fork never needs registry credentials.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/auleewilliams/tiny-turbo-trails:latest
            ghcr.io/auleewilliams/tiny-turbo-trails:${{ github.sha }}
          cache-from: type=gha
