version: 2
updates:
  # Completes the version-update configuration portion of #98. Account-level
  # alerts/security updates and alert triage remain separate owner work.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # The build stage follows the tested Node 22 LTS major. Major upgrades are
      # deliberate changes coordinated with engines and the CI matrix.
      - dependency-name: node
        update-types: [version-update:semver-major]
